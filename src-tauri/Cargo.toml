[package]
name = "vault"
version = "0.1.0"
edition = "2021"
description = "A simple UI around yt-dlp for archiving YouTube channels"

[lib]
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The in-app player talks to AppKit to put mpv's video under the web view.
objc2 = "0.6"
objc2-foundation = "0.3"
