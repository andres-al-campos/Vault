<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="main">
        <div class="topbar">
          <div class="logo"><span>V</span>ault</div>

          <div class="chansel" id="chansel">
            <button id="chansel-btn" disabled>
              <span class="lbl" id="chansel-lbl">No channels yet</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6" /></svg>
            </button>
            <div class="chansel-menu" id="chansel-menu"></div>
          </div>

          <label class="search">
            <input id="url" placeholder="Add a channel or a video: paste a URL, or type @handle" spellcheck="false" autocomplete="off" />
            <button class="add" id="url-x" title="Clear (Esc)" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
            <button class="add" id="fetch" title="Add this channel (Enter)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14" /></svg>
            </button>
          </label>
          <button class="btn btn-icon btn-labelled" id="sync" title="Check YouTube for new videos and re-read this channel's folder" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
            Sync
          </button>

          <button class="btn btn-on btn-labelled" id="watching" title="Back to the videos you have open" hidden></button>

          <div class="cookiesel">
            <button class="btn btn-icon" id="cookies" title="Use cookies from a browser you're signed into YouTube with. Members-only videos need them; without them, Vault waits out YouTube's bot check.">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>
              </svg>
            </button>
          </div>
          <button class="btn btn-icon" id="theme" title="Toggle light / dark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="btn btn-icon btn-labelled" id="side-toggle" title="Hide downloads" aria-pressed="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg>
            <span class="n" id="side-n" hidden></span>
          </button>
        </div>

        <div class="wrap">
          <div id="chanhead"></div>
          <div id="controls"></div>
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty">
            <div class="mark"><span>V</span>ault</div>
            <h2>Add a channel</h2>
            <p>Paste a channel or a video's URL, or type an @handle. Vault lists every video and keeps the ones you choose.</p>
          </div>
        </div>
      </div>

      <aside class="side">
        <div class="side-hd">
          <div class="t">Downloads</div>
          <div class="s" id="qsum">Idle</div>
          <div class="side-actions">
            <button id="qstop" disabled></button>
            <button id="clearq" disabled>Clear queue</button>
            <button id="clear" disabled>Clear finished</button>
          </div>
        </div>
        <div class="queue" id="queue"></div>
      </aside>
    </div>

    <!-- The player. Its stage is a hole: the video is drawn by mpv in a view
         underneath the page, and everything around it is ordinary HTML. -->
    <div class="player" id="player" hidden>
      <div class="ptop">
        <button class="btn btn-icon btn-labelled" id="pback" title="Back to the channel (Esc)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
          Channel
        </button>
        <div class="ptabs" id="ptabs"></div>
      </div>
      <div class="ptip" id="ptip" hidden></div>
      <div class="pseek-tip" id="pseek-tip" hidden></div>
      <div class="stage" id="stage"><img class="cover" id="cover" alt=""><div class="bezel" id="bezel"></div><div class="stage-msg" id="stage-msg" hidden></div></div>
      <div class="pbar">
        <button class="btn btn-icon" id="pplay" title="Play / pause (Space)"></button>
        <span class="ptime" id="ptime">0:00 / 0:00</span>
        <input class="pseek" id="pseek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Position" />
        <button class="pmute" id="pmute"></button>
        <input class="pvol" id="pvol" type="range" min="0" max="100" step="1" value="100" aria-label="Volume" />
        <button class="btn btn-icon" id="pfull"></button>
      </div>
    </div>

    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
